# Local PostgreSQL and Redis for development that matches production.
#   docker compose up -d
# then in .env: DB_CONNECTION=pgsql, DB_PORT=54329, DB_DATABASE=kertai,
# DB_USERNAME=kertai, DB_PASSWORD=kertai, REDIS_PORT=63799,
# QUEUE_CONNECTION=redis, CACHE_STORE=redis.
services:
    postgres:
        image: postgres:17-alpine
        environment:
            POSTGRES_DB: kertai
            POSTGRES_USER: kertai
            POSTGRES_PASSWORD: kertai
        ports:
            - '127.0.0.1:54329:5432'
        volumes:
            - pgdata:/var/lib/postgresql/data
        healthcheck:
            test: ['CMD-SHELL', 'pg_isready -U kertai']
            interval: 5s
            retries: 10

    redis:
        image: redis:7-alpine
        ports:
            - '127.0.0.1:63799:6379'

volumes:
    pgdata:
